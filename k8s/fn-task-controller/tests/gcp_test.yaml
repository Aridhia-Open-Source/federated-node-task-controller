suite: Storage testing for GCP
release:
  namespace: federatednode
  name: federatednode
values:
  - values/base-values.yaml
set:
  storage:
    local:
    gcp:
      volumeHandle: projects/my-project/locations/us-central1-a/instances/my-instance/volumes/vol1
      ip: 10.0.0.1
      shareName: vol1
kubernetesProvider:
  scheme:
    v1/Secret:
      gvr:
        version: v1
        resource: secrets
      namespaced: true
    v1/ConfigMap:
      gvr:
        version: v1
        resource: configmaps
      namespaced: true
  objects:
    - apiVersion: v1
      kind: Secret
      metadata:
        name: github-app
        namespace: federatednode
      type: Opaque
      data:
        GH_SECRET: dGVzdA==
        GH_CLIENT_ID: dGVzdA==
    - apiVersion: v1
      kind: Secret
      metadata:
        name: kc-secrets
        namespace: federatednode
      data:
        KEYCLOAK_ADMIN_PASSWORD: dGVzdA==
        KEYCLOAK_SECRET: dGVzdA==
    - apiVersion: v1
      kind: ConfigMap
      metadata:
        name: keycloak-config
        namespace: federatednode
      data:
        KEYCLOAK_ADMIN: admin
        KC_DB_URL_HOST: testhost.com
        KC_DB_USERNAME: admin_user
tests:
  - it: creates GCP storage class
    template: storageclass.yaml
    asserts:
      - equal:
          path: provisioner
          value: filestore.csi.storage.gke.io
      - notExists:
          path: parameters
  - it: creates GCP PV
    template: controller-volumes.yaml
    documentSelector:
      path: kind
      value: PersistentVolume
    asserts:
      - equal:
          path: spec.csi.driver
          value: filestore.csi.storage.gke.io
      - equal:
          path: spec.csi.volumeHandle
          value: projects/my-project/locations/us-central1-a/instances/my-instance/volumes/vol1
      - equal:
          path: spec.csi.volumeAttributes.ip
          value: 10.0.0.1
      - equal:
          path: spec.csi.volumeAttributes.volume
          value: vol1
  - it: creates GCP configmap
    template: controller-configmap.yaml
    asserts:
      - equal:
          path: data["GCP_STORAGE_ENABLED"]
          value: "true"
      - equal:
          path: data["GCP_VOLUME_HANDLE"]
          value: projects/my-project/locations/us-central1-a/instances/my-instance/volumes/vol1
      - equal:
          path: data["GCP_FILESTORE_IP"]
          value: 10.0.0.1
      - equal:
          path: data["GCP_SHARE_NAME"]
          value: vol1
