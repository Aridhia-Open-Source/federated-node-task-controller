apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: analytics.{{ include "controllerCrdGroup" . }}
spec:
  group: {{ include "controllerCrdGroup" . }}
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - image
                {{- if not .Values.controller.skipUserAuth }}
                - user
                - project
                {{- end }}
                - source
              properties:
                image:
                  type: string
                user:
                  type: object
                  properties:
                    username:
                      type: string
                    email:
                      type: string
                    idpId:
                      type: string
                project:
                  type: string
                dataset:
                  type: object
                  properties:
                    id:
                      type: integer
                    name:
                      type: string
                env:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                outputs:
                  type: array
                  items:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                inputs:
                  type: array
                  items:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                source:
                  type: object
                  nullable: true
                  required:
                    - repository
                  properties:
                    branch:
                      type: string
                    repository:
                      type: string
                db_query:
                  type: object
                  properties:
                    query:
                      type: string
                    dialect:
                      type: string
                ml:
                  type: boolean
                  default: false
                params:
                  type: object
                  description: Object with arguments to be passed to the model
                   x-kubernetes-preserve-unknown-fields: true

  scope: Cluster
  names:
    plural: analytics
    singular: analytic
    kind: Analytics
    shortNames:
    - at
